name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      # Use branch-specific service account JSON already present in repo secrets
      - name: Authenticate to Google Cloud (prod)
        if: github.ref_name == 'main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}

      - name: Authenticate to Google Cloud (staging)
        if: github.ref_name != 'main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Show active gcloud account (best-effort)
        run: gcloud config list account --format 'value(core.account)' || true

      - name: Install root deps (optional)
        run: npm ci

      - name: Install functions deps
        run: npm ci || npm install
        working-directory: functions

      # Derive PROJECT_ID from existing secrets when explicit vars are not set
      - name: Resolve Firebase Project ID
        id: project
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            AUTH_DOMAIN='${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}'
            BUCKET='${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}'
          else
            AUTH_DOMAIN='${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}'
            BUCKET='${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}'
          fi
          PROJECT_ID=""
          if [[ -n "$AUTH_DOMAIN" ]]; then
            PROJECT_ID="${AUTH_DOMAIN%.firebaseapp.com}"
          fi
          if [[ -z "$PROJECT_ID" && -n "$BUCKET" ]]; then
            PROJECT_ID="${BUCKET%.appspot.com}"
          fi
          if [[ -z "$PROJECT_ID" ]]; then
            echo "Failed to resolve Firebase project ID from secrets. Please set repo variables FIREBASE_STAGING_PROJECT_ID / FIREBASE_PROD_PROJECT_ID." >&2
            exit 1
          fi
          echo "project=$PROJECT_ID" >> $GITHUB_OUTPUT

      - name: Write Functions environment file (STORAGE_BUCKET)
        shell: bash
        run: |
          PROJECT_ID='${{ steps.project.outputs.project }}'
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            BUCKET='${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}'
          else
            BUCKET='${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}'
          fi
          if [[ -z "$BUCKET" ]]; then
            echo "No STORAGE_BUCKET secret found; skipping env file creation" >&2
            exit 1
          fi
          echo "STORAGE_BUCKET=$BUCKET" > "functions/.env.${PROJECT_ID}"
          echo "SIGNWELL_API_KEY=${{ secrets.SIGNWELL_API_KEY }}" >> "functions/.env.${PROJECT_ID}"
          echo "Wrote functions/.env.${PROJECT_ID} with STORAGE_BUCKET=$BUCKET and SIGNWELL_API_KEY"

      - name: Deploy Functions (auto-setup cleanup policy)
        run: firebase deploy --only functions --project ${{ steps.project.outputs.project }} --force
